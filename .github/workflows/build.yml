name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridlock-mod-${{ github.ref_name }}
          path: build/libs/gridlock-mod-*.jar

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/gridlock-mod-*.jar
          body: |
            GridLock-Client-Mod für Minecraft 26.3 (Fabric). Braucht Fabric Loader 0.19+ und Fabric API.
            Passendes Server-Plugin: https://github.com/kronig-mc-plugins/gridlock-plugin/releases
